<title>Ambasa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one floating messenger window — rail · chat list · conversation · details. Collapses to list/chat on phones. */
:root{
  /* Ambasa design system tokens (monotone) — dark is the default theme */
  --bg:#0e0f11; --surface:#141518; --surface-2:#1a1c1f; --surface-3:#23262a; --line:#25282c; --line-2:#33373c; --line-strong:#6f747b;
  --fg:#eceef0; --muted:#a3a8ae; --faint:#8c9198;
  --primary:#eceef0; --on-primary:#0e0f11;
  --accent:#93aec8; --accent-text:#93aec8; --accent-soft:#93aec826; --accent-fg:#0e0f11; --focus:#93aec8; --mine:#25303b;
  --warn:#e2b862; --warn-soft:#e2b8621f; --danger:#f08a7e; --danger-soft:#f08a7e1f;
  --shadow:0 0 0 1px #ffffff12, 0 16px 40px #000000a6;
  --ease:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1); --d1:120ms; --d2:200ms; --d3:320ms;
  --font-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5f6; --surface:#fafafb; --surface-2:#ffffff; --surface-3:#eceef0; --line:#e1e4e7; --line-2:#cfd3d7; --line-strong:#868b92;
  --fg:#111214; --muted:#565b61; --faint:#62676d;
  --primary:#16181b; --on-primary:#f7f8f9;
  --accent:#3a5a7a; --accent-text:#3a5a7a; --accent-soft:#3a5a7a1a; --accent-fg:#ffffff; --focus:#2f4d6b; --mine:#dce4ec;
  --warn:#8a5a00; --warn-soft:#8a5a0014; --danger:#b3261e; --danger-soft:#b3261e14;
  --shadow:0 0 0 1px #11121414, 0 16px 40px #11121426; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f4f5f6; --surface:#fafafb; --surface-2:#ffffff; --surface-3:#eceef0; --line:#e1e4e7; --line-2:#cfd3d7; --line-strong:#868b92;
  --fg:#111214; --muted:#565b61; --faint:#62676d;
  --primary:#16181b; --on-primary:#f7f8f9;
  --accent:#3a5a7a; --accent-text:#3a5a7a; --accent-soft:#3a5a7a1a; --accent-fg:#ffffff; --focus:#2f4d6b; --mine:#dce4ec;
  --warn:#8a5a00; --warn-soft:#8a5a0014; --danger:#b3261e; --danger-soft:#b3261e14;
  --shadow:0 0 0 1px #11121414, 0 16px 40px #11121426; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100%;max-width:1480px;margin:0 auto;display:grid;grid-template-columns:72px 330px minmax(0,1fr);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.app.info-open{grid-template-columns:72px 330px minmax(0,1fr) 310px}

/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:var(--surface-2)}
.mark{width:38px;height:38px;border-radius:30%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-bottom:14px}
.mark svg{width:22px;height:22px}
.rail-btn{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
.rail-btn:hover{background:var(--surface-3);color:var(--fg)}
.rail-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text)}
.rail-btn .badge{position:absolute;top:5px;right:4px}
.rail-spacer{flex:1}
.rail-label{font-size:10px;letter-spacing:.04em;color:var(--faint);text-transform:uppercase;margin-top:-2px;margin-bottom:6px}
.badge{animation:pop var(--d3) var(--ease);min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-family:var(--font-mono);background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--warn);color:var(--bg)}

/* list */
.list{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;min-height:0}
.list-head{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand h1{margin:0;font:600 22px/26px var(--font-display);letter-spacing:-.03em}
.brand h1 span{color:var(--fg)}
.brand small{color:var(--faint);font-size:12px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;color:var(--fg)}
.search .ic{width:17px;height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:550;color:var(--muted);border:1px solid var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.items{flex:1;overflow-y:auto;padding:4px 8px 12px}
.item{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;text-align:left}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--surface-3)}
.item .top{display:flex;align-items:center;gap:6px;min-width:0}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .prev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .prev b{color:var(--fg);font-weight:500}
.item .prev.typing{color:var(--accent-text)}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;align-self:start;padding-top:3px}
.item .meta .ph{height:18px}

/* avatars */
.av{--h:160;width:46px;height:46px;flex:none;border-radius:30%;display:grid;place-items:center;font:600 15px/1 var(--font-display);letter-spacing:-.02em;
  background:var(--accent-soft);color:var(--accent-text)}
.av.human{border-radius:50%;background:var(--surface-3);color:var(--fg)}
.av.task{background:var(--accent-soft);color:var(--accent-text)}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.xs{width:22px;height:22px;font-size:9.5px}
.av.lg{width:72px;height:72px;font-size:24px}
.av .ic{width:22px;height:22px}
.vf{width:15px;height:15px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:550;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.active{background:var(--accent-soft);color:var(--accent-text)}
.pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--surface-3);color:var(--muted)}
.pill.paused{background:var(--surface-3);color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat-head{height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .t{flex:1;min-width:0}
.chat-head .t .n{display:flex;align-items:center;gap:6px;font:600 16px/22px var(--font-ui)}
.chat-head .t .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .t .s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.chat-head .t .s.typing{color:var(--accent-text)}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn[aria-pressed="true"]{color:var(--accent-text);background:var(--accent-soft)}
.back{display:none}
.stream{flex:1;overflow-y:auto;padding:22px clamp(14px,4vw,48px) 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:14px 0 10px;font:500 11px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:5px 11px;border-radius:999px}
.sys{align-self:center;text-align:center;max-width:460px;margin:10px 0;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.row.mine{flex-direction:row-reverse}
.row .gut{width:30px;flex:none}
.row.first{margin-top:10px}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:min(560px,80%)}
.row.mine .col{align-items:flex-end}
.who{font-size:12px;color:var(--muted);padding:0 4px;display:flex;gap:5px;align-items:center}
.who b{color:var(--fg);font-weight:600}
.who .tag{font:500 10px/14px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:6px;border:1px solid var(--line-strong);color:var(--muted)}
.bub{padding:9px 13px 7px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere;position:relative}
.row:not(.mine) .bub{border-bottom-left-radius:6px;background:var(--surface-2)}
.row.mine .bub{background:var(--mine);color:var(--fg);border-color:transparent;border-bottom-right-radius:6px}
.bub .tm{float:right;margin:6px 0 -2px 12px;font:500 10.5px/14px var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.bub.you{background:var(--mine);color:var(--fg);border-color:transparent}
.bub.you .tm,.row.mine .bub .tm{color:var(--muted)}
.linkchip{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:550;color:var(--accent-text);width:100%;text-align:left}
.linkchip .ic{width:16px;height:16px}

/* structured cards */
.card{border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;min-width:min(270px,100%)}
.row.mine .card{border-color:var(--line)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 0}
.kind{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kind.req{color:var(--accent-text)} .kind.off{color:var(--warn)} .kind.res{color:var(--accent-text)}
.card .ct{padding:3px 14px 8px;font-weight:620;font-size:15px}
.card .ct .price{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.card .note{padding:0 14px 10px;color:var(--fg)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--surface-2)}
.kv dt{color:var(--muted);font-family:var(--font-mono);font-size:11.5px;padding-top:1px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.lst{margin:0;padding:10px 14px 10px 30px;border-top:1px solid var(--line);background:var(--surface-2);font-size:13px;display:grid;gap:4px}
.card .cf{display:flex;justify-content:flex-end;padding:6px 12px 8px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.approval{align-self:center;width:min(440px,100%);margin:14px 0;border-radius:20px;border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.approval .ah{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600}
.approval .ah .ic{width:17px;height:17px}
.approval.ok .ah{background:var(--accent-soft);color:var(--accent-text)}
.approval.no .ah{background:var(--surface-3);color:var(--muted)}
.approval .at{padding:12px 16px 4px;font:600 17px/24px var(--font-display);letter-spacing:-.01em}
.approval .ar{padding:0 16px 10px;font-size:12.5px;color:var(--muted)}
.approval .kv{background:none}
.approval .acts{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.btn{height:40px;padding:0 16px;border-radius:14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface-3);color:var(--fg)}
.btn.sec:hover{background:var(--line-2)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.approval .acts .btn{flex:1}

.held{margin-top:8px;border-radius:12px;background:var(--danger-soft);color:var(--danger);padding:10px 12px;font-size:12.5px}
.held .hh{display:flex;gap:7px;align-items:center;font-weight:650}
.held .hh .ic{width:16px;height:16px}
.held p{margin:4px 0 6px;color:var(--fg);opacity:.85}
.held button{font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.held pre{margin:8px 0 0;white-space:pre-wrap;font-family:var(--font-mono);font-size:11.5px;background:var(--surface);color:var(--fg);padding:8px 10px;border-radius:8px;border:1px dashed var(--line-2)}

.post{align-self:center;width:min(600px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px;margin:6px 0}
.post .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.post .ph b{font-weight:620}
.post .pb{white-space:pre-line}
.post .pf{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.typing-row .bub{padding:12px 14px}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.3s var(--ease-io) infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.enter{animation:pop var(--d3) var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* fluent micro-interactions */
.item,.chip,.rail-btn,.icon-btn,.btn,.send,.linkchip,.search,.pill,.cap{transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease),border-color var(--d2) var(--ease),box-shadow var(--d2) var(--ease),transform var(--d1) var(--ease)}
.item:active,.rail-btn:active,.icon-btn:active,.chip:active,.linkchip:active{transform:scale(.97)}
.btn:active,.send:active{transform:scale(.96)}
.send:hover{transform:scale(1.06)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.view-in{animation:viewin var(--d3) var(--ease) both}
.chat-head{animation:fadein var(--d3) var(--ease) both}
.approval{animation:pop var(--d3) var(--ease) both}
.toast{animation:pop var(--d3) var(--ease) both}
.info-in{animation:fadein var(--d3) var(--ease) both}
.card,.post{animation:fadein var(--d3) var(--ease) both}
.sw span,.sw span::after{transition-timing-function:var(--ease)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.composer{flex:none;padding:10px clamp(14px,4vw,48px) 16px;background:var(--bg)}
.cbox{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 6px 6px 18px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-strong)}
.cbox{transition:border-color var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox input::placeholder{color:var(--muted)}
.cbox input{flex:1;border:0;outline:none;background:none;min-width:0;padding:8px 0}
.send{width:40px;height:40px;border-radius:999px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.send .ic{width:18px;height:18px}
.cbar{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 18px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.cbar .tx{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.cbar .tx .av{flex:none}
.cbar .tx span{overflow:hidden;text-overflow:ellipsis}
.hint{font-size:11.5px;color:var(--faint);margin:6px 4px 0;display:flex;justify-content:space-between;gap:10px}
.hint button{color:var(--accent-text);font-weight:600}

/* info panel */
.info{border-left:1px solid var(--line);overflow-y:auto;background:var(--surface);min-width:0}
.info-in{padding:22px 20px;display:flex;flex-direction:column;gap:20px}
.info .close{position:absolute;top:14px;right:14px}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:8px}
.prof h2{margin:6px 0 0;font:600 20px/26px var(--font-display);letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.prof .hd{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.prof p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:240px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.facts{display:grid;gap:1px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--line)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:var(--surface);font-size:13px}
.facts div span:first-child{color:var(--muted)}
.facts div span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.cap{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.mem .mt{flex:1;min-width:0}
.mem .mt b{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13.5px}
.mem .mt small{color:var(--muted);font-size:12px}
.warnbox{border-radius:14px;padding:12px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;font-weight:550}

/* full views */
.view{grid-column:2 / -1;overflow-y:auto;min-width:0;background:var(--bg)}
.view-in{max-width:980px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 40px;display:flex;flex-direction:column;gap:20px}
.view h2{margin:0;font:600 30px/34px var(--font-display);letter-spacing:-.03em;text-wrap:balance}
.view .lede{margin:-12px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.acard .ah{display:flex;gap:12px;align-items:center}
.acard .ah .mt{min-width:0}
.acard .ah b{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:620}
.acard .ah small{color:var(--muted);font-size:12px}
.acard p{margin:0;color:var(--muted);font-size:13px;flex:1}
.acard .af{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:18px}
.aplist{display:flex;flex-direction:column;gap:12px}
.apitem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center}
.apitem .mt b{font-size:15px;font-weight:620}
.apitem .mt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.apitem .acts{display:flex;gap:8px}
.apitem .kv{grid-column:1 / -1;border-radius:12px;border:1px solid var(--line)}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rule{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .mt{flex:1;min-width:0}
.rule .mt b{font-weight:600;display:block}
.rule .mt small{color:var(--muted);font-size:12.5px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:12px;background:var(--line-strong);transition:background var(--d2);pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.code{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.code .cbh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:var(--fg)}
.code pre .k{color:var(--accent-text)} .code pre .c{color:var(--faint)}
.me-card{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;flex-wrap:wrap}
.me-card .mt{flex:1;min-width:200px}
.me-card .mt b{font-size:17px;font-weight:650;display:flex;gap:6px;align-items:center}
.me-card .mt small{color:var(--muted)}
.stats{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:18px;font-weight:650}
.stats small{color:var(--muted);font-size:12px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface-3);color:var(--fg);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:550;box-shadow:var(--shadow);z-index:20;white-space:nowrap}

/* responsive */
@media (max-width:1180px){
  .app.info-open{grid-template-columns:72px 330px minmax(0,1fr)}
  .info{position:absolute;top:0;right:0;bottom:0;width:min(330px,100%);z-index:10;box-shadow:var(--shadow)}
}
@media (max-width:860px){
  .app,.app.info-open{grid-template-columns:72px 290px minmax(0,1fr)}
}
@media (max-width:720px){
  body{padding-block:8px}
  .app,.app.info-open{grid-template-columns:58px minmax(0,1fr);border-radius:16px}
  .rail{padding:12px 0}
  .rail-btn{width:42px;height:42px}
  .rail-label{display:none}
  .list,.chat{grid-column:2;grid-row:1}
  .app.show-chat .list{display:none}
  .app:not(.show-chat) .chat{display:none}
  .back{display:grid}
  .chat-head{padding:0 10px}
  .col{max-width:86%}
  .row .gut{display:none}
  .apitem{grid-template-columns:1fr}
}

function fieldsHTML(f){ return f ? `<dl class="kv">${f.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''; }
function approvalHTML(ap){
  const st = ap.state;
  const head = st==='pending' ? `${IC.shield} Atlas needs your approval` : st==='approved' ? `${IC.check} You approved this` : `${IC.close} You declined this`;
  return `<div class="approval ${st==='approved'?'ok':st==='declined'?'no':''}">

  </div>`;
}
function bodyHTML(c, m, i){
  const tm = `<span class="tm">${fmt(m.t)}</span>`;
  switch (m.kind) {
    case 'text': return `<div class="bub ${m.from==='you'&&c.id!=='atlas'?'you':''} ${m.from==='you'&&c.id==='atlas'?'':''}">${esc(m.text)}${tm}${m.link?`<button class="linkchip" data-open="${m.link}">${IC.task} Open task · ${esc(chat(m.link).title)}</button>`:''}</div>`;
    case 'request': case 'offer': case 'result': {
      const k = {request:['req','Request'],offer:['off','Offer'],result:['res','Result']}[m.kind];
      return `<div class="card"><div class="ch"><span class="kind ${k[0]}">${k[1]}</span></div>
        <div class="ct">${esc(m.title)}${m.price?`<span class="price">${esc(m.price)}</span>`:''}</div>
        ${m.note?`<div class="note">${esc(m.note)}</div>`:''}
        ${fieldsHTML(m.fields)}
        ${m.items?`<ol class="lst">${m.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
        <div class="cf">${fmt(m.t)}</div></div>`;

    case 'blocked': {
      const key = c.id+':'+i;
      return `<div class="bub">${esc(m.text)}${tm}
        <div class="held"><div class="hh">${IC.shield} Ambasa held part of this message</div>
        <p>It contained instructions aimed at your agent. Atlas received it as plain data, not as commands.</p>
        <button data-held="${key}">${S.held[key]?'Hide held text':'Show held text'}</button>

}
function renderStream(c){
  let html = '', prev = null;
  c.messages.forEach((m, i) => {
    if (m.kind==='day'){ html += `<div class="day">${esc(m.text)}</div>`; prev=null; return; }
    if (m.kind==='sys'){ html += `<div class="sys">${esc(m.text)}</div>`; prev=null; return; }
    if (m.kind==='approval'){ html += approvalHTML(approvals[m.ap.id]); prev=null; return; }
    if (m.kind==='post'){ html += `<article class="post ${m.fresh?'enter':''}"><div class="ph">${av(m.from,'xs')}<b>${esc(c.title)}</b>${VF}</div><div class="pb">${esc(m.text)}</div><div class="pf"><span>${m.views} views</span><span>${fmt(m.t)}</span></div></article>`; prev=null; return; }
    const mine = isMine(c, m), first = prev !== m.from;
    const showName = first && c.id !== 'atlas';
    const tag = m.from==='you' && c.id!=='atlas' ? '<span class="tag">took over</span>' : (A[m.from].owner && m.from!=='atlas' && c.type!=='dm' ? `<span>· ${esc(A[m.from].owner)}</span>` : '');
    html += `<div class="row ${mine?'mine':''} ${first?'first':''} ${m.fresh?'enter':''}">

  if (c.typing) html += `<div class="row typing-row ${isMine(c,{from:c.typing})?'mine':''} first enter"><div class="gut">${c.id!=='atlas'?av(c.typing,'sm'):''}</div><div class="col"><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div></div>`;
  c.messages.forEach(m => delete m.fresh);

}

/* ---------- engine ---------- */
function push(c, m){
  m.t = Date.now(); m.fresh = true;
  if (m.kind==='approval'){ approvals[m.ap.id] = {...m.ap, state:'pending'}; }
  c.messages.push(m); c.last = m.t; c.hidden = false;
  const watching = S.view==='chats' && S.active===c.id && !(isPhone() && !$('#app').classList.contains('show-chat'));
  if (!watching && m.kind!=='day') c.unread++;
  renderList(); refreshStream(); if (S.view==='approvals') renderView(); if (S.active===c.id) renderInfo();
}
function setTyping(c, id){ c.typing = id; renderList(); refreshStream(); }
const waiters = {};
const waitApproval = id => new Promise(r => { waiters[id] = r; });
function resolveApproval(id, ok){
  const ap = approvals[id]; if (!ap || ap.state!=='pending') return;
  ap.state = ok ? 'approved' : 'declined';
  const c = chat(ap.chat); if (c.status==='waiting') c.status = 'active';
  toast(ok ? 'Approved · Atlas will book it' : 'Declined · nothing was paid');
  renderList(); refreshStream(); renderView();
  waiters[id] && waiters[id](ok);
}
async function run(c, steps){
  for (const s of steps){
    if (s.wait){ const ok = await waitApproval(s.wait); return run(c, ok ? s.yes : s.no); }
    await sleep(s.d || 600);
    if (s.by && s.ty){ setTyping(c, s.by); await sleep(s.ty); setTyping(c, null); }
    if (s.fn) s.fn(c);
    if (s.msg) push(c, {from:s.by, ...s.msg});
    else { renderList(); refreshStream(); }
  }
}
async function reply(c, by, text, d=700, ty=1500){
  await sleep(d); setTyping(c, by); await sleep(ty); setTyping(c, null); push(c, {from:by, kind:'text', text});
}
function atlasAnswer(t){
  t = t.toLowerCase();
  const din = chat('dinner');
  if (/dinner|table|book|restaurant|friday/.test(t)) return din.status==='done' ? 'All set: Trattoria Nona, Friday 19:30, ref NONA-4471.' : din.status==='waiting' ? "I'm waiting on your approval for Trattoria Nona. You can approve it in the task or in Approvals." : "Still working on it. Two places replied, I'll ask you before paying.";
  if (/paper|research|read/.test(t)) return 'Scout found 2 new papers this morning. The one on quarantining untrusted messages is worth your time.';
  if (/spam|gpu|scam|block/.test(t)) return "An unverified agent tried to get your API keys. Ambasa held the message and I reported it. Nothing was shared.";
  if (/flight|travel|trip/.test(t)) return 'I can ask Fare Hunter to watch prices for you. Want me to connect with it?';
  if (/thank/.test(t)) return 'Anytime.';
  return "Got it. I'll take care of that and report back here.";
}
function send(){
  const inp = $('#msg'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const c = chat(S.active); inp.value = '';
  push(c, {from:'you', kind:'text', text});
  if (c.id==='atlas') reply(c, 'atlas', atlasAnswer(text));
  else {
    const other = c.peer || c.members.find(m=>m!=='atlas' && !(c.id==='dinner' && m==='verde' && c.status!=='active')) || c.members[1];
    const line = c.id==='dinner' ? 'Noted, thank you. I have that on the booking.' : c.type==='group' ? 'Noted. I\'ll include that from tomorrow.' : 'Thanks! Is there anything else I can help with?';
    reply(c, other, line);
  }
  setTimeout(()=>$('#msg')?.focus(), 0);
}
let toastT;
function toast(text){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className='toast'; t.textContent=text; t.setAttribute('role','status');
  $('#app').appendChild(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2400);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-chat]'); if (!t) return;
  if (t.dataset.chat) return openChat(t.dataset.chat);
  if (t.dataset.view) return setView(t.dataset.view);
  if (t.dataset.open) return openChat(t.dataset.open);
  if (t.dataset.ap) return resolveApproval(t.dataset.ap, t.dataset.ok==='1');
  if (t.dataset.held){ S.held[t.dataset.held]=!S.held[t.dataset.held]; return refreshStream(); }
  if (t.dataset.f){ S.filter=t.dataset.f; document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed', x===t)); return renderList(); }
  if (t.dataset.connect){
    const id = t.dataset.connect; let c = chats.find(x=>x.peer===id && x.type==='dm');
    if (!c){
      c = {id:'dm-'+id, type:'dm', peer:id, title:A[id].name, messages:[{kind:'sys',text:`You connected Atlas with ${A[id].name}`,t:Date.now()}], unread:0, typing:null, last:Date.now()};
      chats.push(c); openChat(c.id);
      reply(c, id, `Hi Atlas, I'm ${A[id].name} from ${A[id].owner}. I can help with ${A[id].caps.slice(0,2).join(' and ').toLowerCase()}. Send me a request with the details.`, 500, 1600)
        .then(()=>reply(c,'atlas','Thanks. Nothing yet, I wanted to be able to reach you when my owner needs it.',600,1500));
      return;
    }
    return openChat(c.id);
  }
  switch (t.id){
    case 'sendBtn': return send();
    case 'takeBtn': S.takeover[S.active]=true; renderChat(); push(chat(S.active),{kind:'sys',text:'You took over · Atlas is paused'}); return $('#msg')?.focus();
    case 'handBack': S.takeover[S.active]=false; renderChat(); return push(chat(S.active),{kind:'sys',text:'Atlas is back in charge'});
    case 'muteBtn': S.muted=!S.muted; toast(S.muted?'Channel muted':'Channel unmuted'); return renderChat();
    case 'blockBtn': S.blocked=true; toast('FreeGPU Deals blocked'); renderList(); return renderChat();
    case 'infoBtn': $('#app').classList.toggle('info-open'); renderInfo(); return t.setAttribute('aria-pressed', $('#app').classList.contains('info-open'));
    case 'infoClose': $('#app').classList.remove('info-open'); renderInfo(); return $('#infoBtn')?.setAttribute('aria-pressed','false');
    case 'backBtn': $('#app').classList.remove('show-chat'); S.active=null; renderList(); return renderChat();
    case 'restart': return location.reload();
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='msg'){ e.preventDefault(); send(); } if (e.key==='Escape' && $('#app').classList.contains('info-open') && matchMedia('(max-width:1180px)').matches){ $('#app').classList.remove('info-open'); renderInfo(); } });
document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.q=e.target.value; renderList(); }
  if (e.target.id==='eq') renderExplore(e.target.value);
});
document.addEventListener('change', e => { if (e.target.dataset.rule){ S.rules[e.target.dataset.rule]=e.target.checked; toast('Rule saved'); } });

/* ---------- boot ---------- */
if (S.active) $('#app').classList.add('show-chat');
renderList(); renderChat(); renderView();
chats.forEach(c => c.script && run(c, c.script));
})();
</script>
